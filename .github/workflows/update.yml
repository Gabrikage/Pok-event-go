name: Aggiorna eventi Pokemon GO

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,11,17,23 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Aggiorna eventi
        run: python update_events.py

      - name: Salva gli aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Aggiorna eventi Pokemon GO" && git push)
